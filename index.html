<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOPA</title>
<style>
:root { --bg:#1c1c1c; --fg:#d8d8d8; --hl:#6fa8ff; --hover-bg: rgba(111,168,255,0.2);
  --dim: color-mix(in srgb, var(--fg) 55%, transparent);
  --border-c: color-mix(in srgb, var(--fg) 30%, transparent); }
* { box-sizing: border-box; }
html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--fg);
  font-family: ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",Menlo,sans-serif;
  font-size:13px; user-select:none; overscroll-behavior:none; }
button, input, textarea { font-family:inherit; font-size:inherit; background:var(--bg); color:var(--fg);
  border:1px solid var(--border-c); border-radius:0; box-shadow:none; padding:3px 6px; }
button { cursor:pointer; }
button:hover { background:var(--hover-bg); color:var(--fg); }
button.active { background:var(--hover-bg); color:var(--fg); border-color:var(--hl); }
#viewTabs button.active { color:var(--fg); }
.output-list button.active { color:var(--fg); }
button:disabled { opacity:.35; cursor:default; }
button:disabled:hover { background:var(--bg); color:var(--fg); }
textarea { resize:none; width:100%; }

.app { height:100vh; height:100dvh; display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }

/* ---------- topbar: seamless segmented groups ---------- */
.topbar { display:flex; align-items:stretch; border-bottom:1px solid var(--border-c); flex:none; flex-wrap:wrap; }
.topbar .title { font-weight:bold; letter-spacing:2px; padding:6px 12px; display:flex; align-items:center;
  border-right:1px solid var(--border-c); }
.btngroup { display:flex; align-items:stretch; }
.btngroup > button, .btngroup > span { border:none; border-right:1px solid var(--border-c); border-radius:0;
  display:flex; align-items:center; padding:0 10px; margin:0; }
.btngroup button svg { width:14px; height:14px; display:block; }
.spacer { flex:1; }
.themectl { display:flex; align-items:stretch; border-left:1px solid var(--border-c); }
.themectl .themelabel { color:var(--dim); font-size:13px; display:flex; align-items:center; padding:0 6px; }
.hoverinput { width:46px; border:none; border-left:1px solid var(--border-c); border-right:1px solid var(--border-c);
  border-radius:0; background:transparent; text-align:center; padding:0 4px; -moz-appearance:textfield; }
.hoverinput::-webkit-inner-spin-button, .hoverinput::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
.selInfo { display:flex; align-items:center; padding:0 10px; color:var(--dim); }

/* ---------- main layout ---------- */
.main { flex:1; display:flex; min-height:0; }

.timeline-wrap { flex:0 0 50%; max-width:50%; height:100%; position:relative; }
.timeline-panel { width:100%; height:100%; display:grid;
  grid-template-columns:46px repeat(4,1fr); grid-auto-rows:1fr;
  border-left:1px solid var(--border-c); }
.now-marker { position:absolute; width:2px; background:var(--hl); pointer-events:none; z-index:2; }
.hour-label { padding:2px 4px; color:var(--dim); font-size:13px; display:flex; align-items:flex-start;
  border-right:1px solid var(--border-c); border-bottom:1px solid var(--border-c); }
.qblock { border-right:1px solid var(--border-c); border-bottom:1px solid var(--border-c); position:relative;
  overflow:hidden; padding:1px 3px; cursor:pointer; min-width:0;
  display:flex; flex-direction:column; gap:0; }
.qblock .rl { flex:1 1 0; min-height:0; font-size:11px; line-height:1.2; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; color:var(--fg); }
.qblock .obadge { position:absolute; top:1px; right:2px; font-size:10px; color:var(--fg); }
.qblock.selected { outline:2px solid var(--hl); outline-offset:-2px; z-index:1; }

.side-panel { flex:1 1 auto; min-width:0; display:flex; flex-direction:row; height:100%; }
.side-col { flex:1; min-width:0; display:flex; flex-direction:column; border-right:1px solid var(--border-c); }
.side-col:last-child { border-right:none; }
.side-col-head { padding:5px 6px; border-bottom:1px solid var(--border-c); flex:none; color:var(--dim);
  display:flex; justify-content:space-between; align-items:center; }
.side-col-body { flex:1; overflow-y:auto; padding:0; display:flex; flex-direction:column; }
.empty-hint { color:var(--dim); padding:20px 6px 0; text-align:center; }

/* ---------- project/area rows ---------- */
.tag-row { display:flex; align-items:stretch; padding:0; margin:0; cursor:pointer;
  border-bottom:1px solid var(--border-c); }
.tag-row:last-of-type { border-bottom:none; }
.tag-row .rowswatch { flex:none; width:30px; align-self:stretch; padding:0; margin:0;
  border:none; border-right:1px solid var(--border-c); border-radius:0; }
.tag-row .rowbody { flex:1; min-width:0; display:flex; align-items:stretch; }
.tag-row .namewrap { flex:1; min-width:0; display:flex; align-items:center; padding:6px 8px; }
.tag-row .namewrap span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tag-row .namewrap input[type="text"] { flex:1; min-width:0; border:none; padding:0; background:transparent; }
.tag-row .rowbtn { flex:none; border:none; color:var(--dim); padding:0 5px; border-radius:0; }
.tag-row .rowbtn:last-child { padding-right:8px; }
.tag-row .rowbtn svg { width:14px; height:14px; display:block; }
.rowbody.active { background:var(--hover-bg); }
.rowbody.active .rowbtn { background:var(--hover-bg); }
.rowbtn.pinned { color:var(--hl); }
.tag-row.archived { opacity:0.5; }
.tag-row.archived .namewrap span { text-decoration:line-through; }
.addbtn { width:100%; border:none; border-top:1px solid var(--border-c); border-bottom:1px solid var(--border-c); padding:8px; margin:0; }

/* ---------- color swatch + popover ---------- */
.cswatch { width:20px; height:20px; padding:0; flex:none; }
.themeswatch { width:26px; align-self:stretch; padding:0; margin:0; border:none;
  border-left:1px solid var(--border-c); border-right:1px solid var(--border-c); border-radius:0; }
.swatchhost { display:flex; align-self:stretch; }
.color-popover { background:var(--bg); border:1px solid var(--border-c); padding:6px; width:160px; }
.color-history { display:grid; grid-template-columns:repeat(6,18px); gap:3px; margin-top:6px; }
.cswatch-opt { width:18px; height:18px; padding:0; border:1px solid var(--border-c); cursor:pointer; }
.cpop-hex-input { width:100%; margin-top:6px; }

/* ---------- output list ---------- */
.output-list { flex:1; display:flex; flex-direction:column; border-bottom:1px solid var(--border-c); min-height:0; }
.output-list button { flex:1; border:none; border-bottom:1px solid var(--border-c); width:100%; margin:0; min-height:0; }
.output-list button:last-child { border-bottom:none; }

/* ---------- notes ---------- */
.notes-section { flex:1; display:flex; flex-direction:column; min-height:0; }
.notes-section textarea { flex:1; border:none; background:transparent; padding:8px; margin:0; }

/* ---------- multi-select mixed state ---------- */
.mixed-banner { color:var(--dim); font-size:13px; padding:6px; display:flex; justify-content:space-between;
  align-items:center; border-bottom:1px solid var(--border-c); }
.mixed-banner .actions { display:flex; }
.mixed-banner button { padding:2px 8px; font-size:13px; border:none; border-left:1px solid var(--border-c); }
.notes-list { display:flex; flex-direction:column; padding:6px; gap:6px; }
.notes-list .note-item { border-top:1px solid var(--border-c); padding-top:4px; white-space:pre-wrap; }
.notes-list .note-item:first-child { border-top:none; padding-top:0; }

/* ---------- mobile ---------- */
.mobile-tabs { display:none; border-bottom:1px solid var(--border-c); flex:none; }
.mobile-tabs button { flex:1; border:none; border-right:1px solid var(--border-c); border-radius:0; }
.mobile-tabs button:last-child { border-right:none; }

@media (max-width:760px) {
  .main { flex-direction:column; }
  .timeline-wrap { flex:1 1 auto; max-width:none; width:100%; }
  .side-panel { flex:0 0 42vh; height:42vh; border-top:1px solid var(--border-c); flex-direction:column; }
  .side-col { border-right:none; display:none; }
  .side-col.mobile-active { display:flex; }
  .mobile-tabs { display:flex; }
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar">
    <div class="title">TOPA</div>
    <div class="btngroup" id="dateNav">
      <button id="prevDay">&lt;</button>
      <span id="dateLabel">----</span>
      <button id="nextDay">&gt;</button>
      <button id="todayBtn" data-i="today"></button>
    </div>
    <div class="btngroup" id="viewTabs">
      <button data-view="project">P</button>
      <button data-view="area">A</button>
      <button data-view="output">O</button>
    </div>
    <div class="btngroup" id="actionGroup">
      <button id="clearDataBtn" disabled data-i="clearData"></button>
      <button id="deselectBtn" disabled data-i="deselect"></button>
    </div>
    <div class="btngroup" id="cpGroup">
      <button id="copyBtn" disabled></button>
      <button id="pasteBtn" disabled></button>
    </div>
    <div class="btngroup" id="phGroup"><span id="phInfo"></span></div>
    <div class="btngroup" id="ioGroup">
      <button id="exportBtn"></button>
      <button id="importBtn"></button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
    <span class="selInfo" id="selInfo"></span>
    <div class="spacer"></div>
    <div class="themectl">
      <span class="themelabel" data-i="bg"></span><span class="swatchhost" id="themeBgHost"></span>
      <span class="themelabel" data-i="fg"></span><span class="swatchhost" id="themeFgHost"></span>
      <span class="themelabel" data-i="hl"></span><span class="swatchhost" id="themeHlHost"></span>
      <span class="themelabel" data-i="hoverRatio"></span><input class="hoverinput" id="hoverRatio" type="number" min="0" max="100" step="5">
    </div>
  </div>

  <div class="mobile-tabs" id="mobileTabs">
    <button data-col="project" data-i="mtProject"></button>
    <button data-col="area" data-i="mtArea"></button>
    <button data-col="output" data-i="mtOutput"></button>
  </div>

  <div class="main">
    <div class="timeline-wrap" id="timelineWrap">
      <div class="timeline-panel" id="timelinePanel"></div>
      <div id="nowMarker" class="now-marker" style="display:none;"></div>
    </div>
    <div class="side-panel">
      <div class="side-col" data-col="project">
        <div class="side-col-head"><span data-i="headProject"></span></div>
        <div class="side-col-body" id="colProject"></div>
      </div>
      <div class="side-col" data-col="area">
        <div class="side-col-head"><span data-i="headArea"></span></div>
        <div class="side-col-body" id="colArea"></div>
      </div>
      <div class="side-col mobile-active" data-col="output">
        <div class="side-col-head"><span data-i="headOutput"></span></div>
        <div class="side-col-body" id="colOutput"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@jaames/iro/dist/iro.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
<script>
/* ===================== i18n ===================== */
const STRINGS = {
  zh: {
    today: '今天', clearData: '清空信息', deselect: '取消选择',
    bg: 'bg', fg: 'fg', hl: 'hl', hoverRatio: 'hover%',
    mtProject: '项目', mtArea: '领域', mtOutput: '产出/备注',
    headProject: 'PROJECT', headArea: 'AREA', headOutput: 'OUTPUT', headNotes: 'NOTES',
    emptyHint: '选中一个或多个时间块',
    selCount: (n) => `已选 ${n} 块`,
    ph: (v) => `PH ${v}`,
    mixed: '多选 · 不一致', edit: '编辑', merge: '合并',
    confirmOverwrite: '将覆盖这些块本来的设置，是否继续？',
    confirmClear: '将清空所选块上的全部标注，是否继续？',
    confirmPasteOverwrite: '将覆盖所选块上已有的标注，是否继续？',
    confirmDeleteProject: '确定要删除这个项目吗？它在所有块上的标注都会被移除，此操作无法撤销。',
    confirmDeleteArea: '确定要删除这个领域吗？它在所有块上的标注都会被移除，此操作无法撤销。',
    copyTitle: '复制所选块', pasteTitle: '粘贴到所选块',
    confirmImport: '导入将覆盖当前所有数据，是否继续？',
    importInvalid: '文件内容不是有效的 TOPA 数据',
    exportTitle: '导出数据', importTitle: '导入数据',
    addProject: '+ 新建项目', addArea: '+ 新建领域',
    pin: '置顶', archive: '归档', restore: '恢复',
    newProjectName: '新项目', newAreaName: '新领域',
    hexPlaceholder: '#rrggbb'
  }
};
const LOCALE = 'zh';
function t(key, ...args) {
  const v = STRINGS[LOCALE][key];
  return typeof v === 'function' ? v(...args) : v;
}
document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });

/* ===================== data ===================== */
const STORAGE_KEY = 'topa-data-v1';
function uid(prefix) { return prefix + '_' + Math.random().toString(36).slice(2, 8); }
const PALETTE = [
  '#e57373','#f06292','#ba68c8','#9575cd','#7986cb','#64b5f6',
  '#4fc3f7','#4dd0e1','#4db6ac','#81c784','#aed581','#dce775',
  '#fff176','#ffd54f','#ffb74d','#ff8a65','#a1887f','#e0e0e0'
];
function randomColor() { return PALETTE[Math.floor(Math.random() * PALETTE.length)]; }

function defaultData() {
  return {
    meta: { schemaVersion: 1, displayView: 'project' },
    theme: { bg: '#1c1c1c', fg: '#d8d8d8', hl: '#6fa8ff', hoverRatio: 0.2 },
    projects: {}, areas: {}, blocks: {}, colorHistory: []
  };
}
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultData();
    const parsed = JSON.parse(raw);
    const d = defaultData();
    return Object.assign(d, parsed, {
      meta: Object.assign(d.meta, parsed.meta),
      theme: Object.assign(d.theme, parsed.theme),
      projects: parsed.projects || {},
      areas: parsed.areas || {},
      blocks: parsed.blocks || {},
      colorHistory: parsed.colorHistory || []
    });
  } catch (e) { console.error('load failed', e); return defaultData(); }
}
function saveData() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) { console.error('save failed', e); } }
let db = loadData();

/* ===================== state ===================== */
function pad2(n) { return String(n).padStart(2, '0'); }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
let currentDate = todayStr();
let selected = new Set();
let dragging = false, dragMoved = false, dragStartIdx = null, dragBaseSelection = new Set();
let mobileActiveCol = 'output';
let unlocked = { project: false, area: false, output: false, notes: false };

function idxToKey(idx) { return blockKey(currentDate, Math.floor(idx / 4), idx % 4); }
function blockKey(dateStr, hour, q) { return `${dateStr}-${pad2(hour)}-${q}`; }
function getBlock(key) { return db.blocks[key] || null; }
function ensureBlock(key) {
  if (!db.blocks[key]) db.blocks[key] = { projectIds: [], areaId: null, output: null, notes: '' };
  return db.blocks[key];
}
function pruneIfEmpty(key) {
  const b = db.blocks[key];
  if (!b) return;
  if (b.projectIds.length === 0 && !b.areaId && b.output == null && !b.notes) delete db.blocks[key];
}
function hexToRgba(hex, alpha) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ===================== color popover (iro.js based) ===================== */
let activePopover = null;
function pushColorHistory(c) {
  db.colorHistory = (db.colorHistory || []).filter(x => x.toLowerCase() !== c.toLowerCase());
  db.colorHistory.unshift(c);
  if (db.colorHistory.length > 12) db.colorHistory.length = 12;
  saveData();
}
function closeColorPopover() {
  if (activePopover) { activePopover.finish(); activePopover = null; }
}
function openColorPopover(anchorEl, initial, onChange) {
  closeColorPopover();
  const rect = anchorEl.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'color-popover';
  pop.style.position = 'fixed';
  pop.style.top = Math.min(rect.bottom + 4, window.innerHeight - 260) + 'px';
  pop.style.left = Math.min(rect.left, window.innerWidth - 170) + 'px';
  pop.style.zIndex = 200;
  document.body.appendChild(pop);

  let finalColor = initial;
  const wheelHost = document.createElement('div');
  pop.appendChild(wheelHost);
  let picker = null;
  if (window.iro) {
    picker = new iro.ColorPicker(wheelHost, {
      width: 140, color: initial,
      layout: [
        { component: iro.ui.Box },
        { component: iro.ui.Slider, options: { sliderType: 'hue' } }
      ]
    });
    picker.on('color:change', (color) => { finalColor = color.hexString; onChange(finalColor); });
  } else {
    const warn = document.createElement('div');
    warn.style.color = 'var(--dim)'; warn.style.fontSize = '10px';
    warn.textContent = '(取色器组件加载失败，可用下方 hex 输入)';
    pop.appendChild(warn);
  }

  if ((db.colorHistory || []).length) {
    const hist = document.createElement('div');
    hist.className = 'color-history';
    db.colorHistory.forEach(c => {
      const s = document.createElement('button');
      s.type = 'button'; s.className = 'cswatch-opt'; s.style.backgroundColor = c;
      s.onclick = (e) => { e.stopPropagation(); finalColor = c; if (picker) picker.color.hexString = c; onChange(c); };
      hist.appendChild(s);
    });
    pop.appendChild(hist);
  }

  const hexInput = document.createElement('input');
  hexInput.type = 'text'; hexInput.value = initial; hexInput.className = 'cpop-hex-input';
  hexInput.placeholder = t('hexPlaceholder');
  hexInput.onclick = (e) => e.stopPropagation();
  hexInput.onchange = () => {
    if (/^#[0-9a-fA-F]{6}$/.test(hexInput.value)) {
      finalColor = hexInput.value;
      if (picker) picker.color.hexString = finalColor;
      onChange(finalColor);
    }
  };
  pop.appendChild(hexInput);

  function outsideClose(e) {
    if (!pop.contains(e.target) && e.target !== anchorEl) { closeColorPopover(); }
  }
  setTimeout(() => document.addEventListener('mousedown', outsideClose), 0);

  activePopover = {
    finish: () => {
      pushColorHistory(finalColor);
      pop.remove();
      document.removeEventListener('mousedown', outsideClose);
    }
  };
}
function colorSwatch(initial, onChange) {
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'cswatch';
  btn.style.backgroundColor = initial;
  btn.onclick = (e) => {
    e.stopPropagation();
    openColorPopover(btn, initial, (c) => { btn.style.backgroundColor = c; onChange(c); });
  };
  return btn;
}
function rowColorSwatch(initial, onChange) {
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'rowswatch';
  btn.style.backgroundColor = initial;
  btn.onclick = (e) => {
    e.stopPropagation();
    openColorPopover(btn, initial, (c) => { btn.style.backgroundColor = c; onChange(c); });
  };
  return btn;
}
function themeSwatch(initial, onChange) {
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'themeswatch';
  btn.style.backgroundColor = initial;
  btn.onclick = (e) => {
    e.stopPropagation();
    openColorPopover(btn, initial, (c) => { btn.style.backgroundColor = c; onChange(c); });
  };
  return btn;
}
let editingId = null; // id of the project/area row currently in inline-edit mode

function lucideBtn(iconName, fallbackText, title, onClick) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'rowbtn'; if (title) b.title = title;
  if (window.lucide) {
    const i = document.createElement('i'); i.setAttribute('data-lucide', iconName);
    b.appendChild(i);
  } else { b.textContent = fallbackText; }
  b.onclick = (e) => { e.stopPropagation(); onClick(); };
  return b;
}
function refreshIcons() { if (window.lucide) lucide.createIcons(); }

function buildTagRow(id, obj, onColorChange, onNameChange, onDelete, isActive, onToggle, opts) {
  opts = opts || {};
  const row = document.createElement('div'); row.className = 'tag-row';
  if (opts.archived) row.classList.add('archived');
  const swatch = rowColorSwatch(obj.color, onColorChange);

  const bodyWrap = document.createElement('div'); bodyWrap.className = 'rowbody';
  if (isActive) bodyWrap.classList.add('active');

  const nameWrap = document.createElement('div'); nameWrap.className = 'namewrap';
  if (editingId === id) {
    const input = document.createElement('input');
    input.type = 'text'; input.value = obj.name;
    input.onclick = (e) => e.stopPropagation();
    const commit = () => { onNameChange(input.value); editingId = null; renderAll(); };
    input.onblur = commit;
    input.onkeydown = (e) => {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') { editingId = null; renderAll(); }
    };
    nameWrap.appendChild(input);
    setTimeout(() => { input.focus(); input.select(); }, 0);
  } else {
    const span = document.createElement('span'); span.textContent = obj.name;
    nameWrap.appendChild(span);
  }
  if (onToggle && editingId !== id) {
    bodyWrap.addEventListener('click', (e) => {
      if (e.target.closest('.rowbtn, input')) return;
      onToggle();
    });
  }

  const editBtn = document.createElement('button');
  editBtn.type = 'button'; editBtn.className = 'rowbtn'; editBtn.textContent = '\u270e';
  editBtn.onclick = (e) => { e.stopPropagation(); editingId = id; renderAll(); };

  const delBtn = document.createElement('button');
  delBtn.type = 'button'; delBtn.className = 'rowbtn'; delBtn.textContent = '\u00d7';
  delBtn.onclick = (e) => { e.stopPropagation(); confirmThen(opts.confirmDeleteMsg || t('confirmOverwrite'), onDelete); };

  bodyWrap.append(nameWrap, editBtn);
  (opts.extraButtons || []).forEach(btn => bodyWrap.appendChild(btn));
  bodyWrap.appendChild(delBtn);
  row.append(swatch, bodyWrap);
  return row;
}

/* ===================== favicon ===================== */
// Glyph spells T-O-P-A; ink extends to 6..99 in a 105 box (stroke 18), so the viewBox leaves an even 6 margin.
const GLYPH_D = 'M15,15 L15,15 L15,75 L45,75 L45,15 L15,15 M15,30 L15,30 L45,30 M15,45 L15,45 L45,45 M15,60 L15,60 L45,60 M30,15 L30,15 L30,75 M60,15 L60,15 L60,15 M60,30 L60,30 L60,30 M60,45 L60,45 L60,45 M60,60 L60,60 L60,60 M60,75 L60,75 L60,75 M75,15 L75,15 L75,15 M75,30 L75,30 L75,30 M75,45 L75,45 L75,45 M75,60 L75,60 L75,60 M75,75 L75,75 L75,75 ';
function relLuminance(hex) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255)
    .map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
// light scheme -> the darker of fg/bg, dark scheme -> the lighter one
function faviconColor() {
  return db.theme.hl;
  const a = db.theme.fg, b = db.theme.bg;
  const aDarker = relLuminance(a) <= relLuminance(b);
  const dark = aDarker ? a : b, light = aDarker ? b : a;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? light : dark;
}
function updateFavicon() {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><path d="${GLYPH_D}" fill="none" stroke="${faviconColor()}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  let link = document.querySelector('link[rel="icon"]');
  if (!link) { link = document.createElement('link'); link.rel = 'icon'; document.head.appendChild(link); }
  link.type = 'image/svg+xml';
  link.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateFavicon);

function outputColor(v) { return hexToRgba(db.theme.hl, 0.06 + (v / 9) * 0.94); }

function setupThemeSwatches() {
  const bgHost = document.getElementById('themeBgHost');
  const fgHost = document.getElementById('themeFgHost');
  const hlHost = document.getElementById('themeHlHost');
  bgHost.innerHTML = ''; fgHost.innerHTML = ''; hlHost.innerHTML = '';
  bgHost.appendChild(themeSwatch(db.theme.bg, c => { db.theme.bg = c; applyTheme(); saveData(); renderTimeline(); }));
  fgHost.appendChild(themeSwatch(db.theme.fg, c => { db.theme.fg = c; applyTheme(); saveData(); renderTimeline(); }));
  hlHost.appendChild(themeSwatch(db.theme.hl, c => { db.theme.hl = c; applyTheme(); saveData(); renderTimeline(); }));

  const hoverInput = document.getElementById('hoverRatio');
  hoverInput.value = Math.round(db.theme.hoverRatio * 100);
  hoverInput.addEventListener('input', () => {
    const v = parseFloat(hoverInput.value);
    if (isNaN(v)) return;
    db.theme.hoverRatio = Math.min(100, Math.max(0, v)) / 100;
    applyTheme(); saveData();
  });
}

/* ===================== timeline render ===================== */
const timelinePanel = document.getElementById('timelinePanel');
const dateLabel = document.getElementById('dateLabel');
const phInfo = document.getElementById('phInfo');

// task-based: a task = consecutive blocks sharing a project and the same output value
// ph = sum over tasks of (task output * task block count * 0.25), each block being a quarter hour
// multi-project blocks count in each of their projects' tasks
function computeProductivityHours(dateStr) {
  const runs = {}; // projectId -> { out, n } for the task currently running
  let ph = 0;
  const close = (id) => {
    const r = runs[id];
    if (r) { ph += r.out * r.n * 0.25; delete runs[id]; }
  };
  for (let i = 0; i < 96; i++) {
    const b = getBlock(blockKey(dateStr, Math.floor(i / 4), i % 4));
    const ids = b ? b.projectIds.filter(id => db.projects[id]) : [];
    const out = (b && b.output != null) ? b.output : 0;
    Object.keys(runs).forEach(id => { if (!ids.includes(id)) close(id); });
    ids.forEach(id => {
      const r = runs[id];
      if (r && r.out === out) r.n++;
      else { close(id); runs[id] = { out, n: 1 }; }
    });
  }
  Object.keys(runs).forEach(id => close(id));
  return ph;
}
function updatePH() { phInfo.textContent = t('ph', String(+computeProductivityHours(currentDate).toFixed(2))); }

function renderTimeline() {
  dateLabel.textContent = currentDate;
  updatePH();
  timelinePanel.innerHTML = '';
  const view = db.meta.displayView;
  let prevProjSig = undefined, prevAreaName = undefined, prevNotes = undefined;

  for (let h = 0; h < 24; h++) {
    const label = document.createElement('div');
    label.className = 'hour-label';
    label.textContent = pad2(h) + ':00';
    timelinePanel.appendChild(label);

    for (let q = 0; q < 4; q++) {
      const idx = h * 4 + q;
      const key = idxToKey(idx);
      const b = getBlock(key);
      const el = document.createElement('div');
      el.className = 'qblock';
      el.dataset.key = key; el.dataset.idx = idx;

      if (b) {
        if (view === 'project' && b.projectIds.length) {
          const cols = b.projectIds.map(id => db.projects[id]).filter(Boolean).map(p => hexToRgba(p.color, 0.35));
          if (cols.length === 1) el.style.backgroundColor = cols[0];
          else if (cols.length > 1) el.style.backgroundImage = `linear-gradient(90deg, ${cols.join(', ')})`;
        } else if (view === 'area' && b.areaId && db.areas[b.areaId]) {
          el.style.backgroundColor = hexToRgba(db.areas[b.areaId].color, 0.35);
        } else if (view === 'output' && b.output != null) {
          el.style.backgroundColor = outputColor(b.output);
        }
      }
      if (selected.has(key)) {
        el.classList.add('selected');
        el.style.boxShadow = `inset 0 0 0 999px ${hexToRgba(db.theme.hl, 0.35)}`;
      }

      // three fixed line slots (project / area / notes) so content aligns across blocks;
      // each independently suppresses consecutive repeats. output moves to a corner badge.
      const projLine = document.createElement('div'); projLine.className = 'rl';
      const areaLine = document.createElement('div'); areaLine.className = 'rl';
      const notesLine = document.createElement('div'); notesLine.className = 'rl';
      el.append(projLine, areaLine, notesLine);

      const projNames = b ? b.projectIds.map(id => db.projects[id] && db.projects[id].name).filter(Boolean) : [];
      const projSig = b ? projNames.join(',') : null;
      if (b && projNames.length) projLine.textContent = (projSig !== prevProjSig) ? projNames.join('/') : '...';
      prevProjSig = b ? projSig : undefined;

      const areaName = (b && b.areaId && db.areas[b.areaId]) ? db.areas[b.areaId].name : null;
      if (areaName) areaLine.textContent = (areaName !== prevAreaName) ? areaName : '...';
      prevAreaName = b ? areaName : undefined;

      const notesVal = (b && b.notes) ? b.notes : null;
      if (notesVal) notesLine.textContent = (notesVal !== prevNotes) ? notesVal : '...';
      prevNotes = b ? notesVal : undefined;

      if (b && b.output != null) {
        const badge = document.createElement('div'); badge.className = 'obadge'; badge.textContent = b.output;
        el.appendChild(badge);
      }

      timelinePanel.appendChild(el);
    }
  }
  updateNowMarker();
}

const timelineWrap = document.getElementById('timelineWrap');
const nowMarker = document.getElementById('nowMarker');
function updateNowMarker() {
  if (currentDate !== todayStr()) { nowMarker.style.display = 'none'; return; }
  const now = new Date();
  const hour = now.getHours(), minute = now.getMinutes() + now.getSeconds() / 60;
  const q0 = timelinePanel.querySelector(`.qblock[data-idx="${hour * 4}"]`);
  const q3 = timelinePanel.querySelector(`.qblock[data-idx="${hour * 4 + 3}"]`);
  if (!q0 || !q3) { nowMarker.style.display = 'none'; return; }
  const wrapRect = timelineWrap.getBoundingClientRect();
  const r0 = q0.getBoundingClientRect();
  const r3 = q3.getBoundingClientRect();
  const totalWidth = (r3.left + r3.width) - r0.left;
  nowMarker.style.display = 'block';
  nowMarker.style.top = (r0.top - wrapRect.top) + 'px';
  nowMarker.style.height = r0.height + 'px';
  nowMarker.style.left = (r0.left - wrapRect.left + (minute / 60) * totalWidth) + 'px';
}
setInterval(updateNowMarker, 15000);
let resizeRaf = null;
window.addEventListener('resize', () => {
  if (resizeRaf) cancelAnimationFrame(resizeRaf);
  resizeRaf = requestAnimationFrame(updateNowMarker);
});

/* ===================== selection & drag ===================== */
function applySelectionHighlight() {
  timelinePanel.querySelectorAll('.qblock').forEach(el => {
    const sel = selected.has(el.dataset.key);
    el.classList.toggle('selected', sel);
    el.style.boxShadow = sel ? `inset 0 0 0 999px ${hexToRgba(db.theme.hl, 0.35)}` : '';
  });
}
function computeRange(idxA, idxB) {
  const lo = Math.min(idxA, idxB), hi = Math.max(idxA, idxB);
  const s = new Set();
  for (let i = lo; i <= hi; i++) s.add(idxToKey(i));
  return s;
}
function clearSelection() {
  selected = new Set();
  unlocked = { project: false, area: false, output: false, notes: false };
  renderAll();
}

timelinePanel.addEventListener('mousedown', (e) => {
  const el = e.target.closest('.qblock');
  if (!el) return;
  e.preventDefault();
  dragging = true; dragMoved = false;
  dragStartIdx = +el.dataset.idx;
  dragBaseSelection = new Set(selected);
});
document.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const elAt = document.elementFromPoint(e.clientX, e.clientY);
  const qb = elAt && elAt.closest && elAt.closest('.qblock');
  if (!qb || !timelinePanel.contains(qb)) return;
  const idx = +qb.dataset.idx;
  if (idx !== dragStartIdx) dragMoved = true;
  if (dragMoved) {
    const range = computeRange(dragStartIdx, idx);
    selected = new Set([...dragBaseSelection, ...range]);
    applySelectionHighlight();
  }
});
document.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  if (!dragMoved) {
    const key = idxToKey(dragStartIdx);
    selected = new Set(dragBaseSelection);
    if (selected.has(key)) selected.delete(key); else selected.add(key);
    applySelectionHighlight();
  }
  unlocked = { project: false, area: false, output: false, notes: false };
  renderSidePanel();
});
timelinePanel.addEventListener('contextmenu', (e) => { e.preventDefault(); clearSelection(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { clearSelection(); return; }
  const tag = (e.target && e.target.tagName || '').toUpperCase();
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c') {
    if (selected.size) { e.preventDefault(); copySelectedBlocks(); }
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
    if (selected.size) { e.preventDefault(); pasteToSelectedBlocks(); }
  }
});
document.getElementById('topbar').addEventListener('click', (e) => { if (e.target === e.currentTarget) clearSelection(); });

const colArea = document.getElementById('colArea');
const colOutput = document.getElementById('colOutput');
const clearDataBtn = document.getElementById('clearDataBtn');
const deselectBtn = document.getElementById('deselectBtn');

function selectedBlocks() { return [...selected].map(k => ({ key: k, block: getBlock(k) })); }
function setSign(arr) { return JSON.stringify([...new Set(arr)].sort()); }
function confirmThen(msg, fn) { if (confirm(msg)) fn(); }

function updateSelInfo() {
  const has = selected.size > 0;
  clearDataBtn.disabled = !has;
  deselectBtn.disabled = !has;
  copyBtn.disabled = !has;
  pasteBtn.disabled = !has || !blockClipboard;

}
clearDataBtn.onclick = () => {

/* ===================== copy / paste ===================== */
const copyBtn = document.getElementById('copyBtn');
const pasteBtn = document.getElementById('pasteBtn');
let blockClipboard = null;
function blockHasData(b) { return !!b && (b.projectIds.length || b.areaId || b.output != null || b.notes); }
function copySelectedBlocks() {
  if (!selected.size) return;
  const key = [...selected].sort()[0];
  const b = getBlock(key);
  blockClipboard = b
    ? { projectIds: [...b.projectIds], areaId: b.areaId, output: b.output, notes: b.notes }
    : { projectIds: [], areaId: null, output: null, notes: '' };
  updateSelInfo();
}
function pasteToSelectedBlocks() {
  if (!selected.size || !blockClipboard) return;
  const doPaste = () => {
    selected.forEach(key => {
      if (blockClipboard.projectIds.length || blockClipboard.areaId || blockClipboard.output != null || blockClipboard.notes) {
        db.blocks[key] = { projectIds: [...blockClipboard.projectIds], areaId: blockClipboard.areaId, output: blockClipboard.output, notes: blockClipboard.notes };
      } else {
        delete db.blocks[key];
      }
    });
    saveData(); renderAll();
  };
  const hasExisting = [...selected].some(key => blockHasData(getBlock(key)));
  if (hasExisting) confirmThen(t('confirmPasteOverwrite'), doPaste); else doPaste();
}
copyBtn.onclick = copySelectedBlocks;
pasteBtn.onclick = pasteToSelectedBlocks;

function renderSidePanel() {
  const items = selectedBlocks();
  updateSelInfo();
  renderProjectCol(items);
  renderAreaCol(items);
  renderOutputNotesCol(items);
}

/* ---- PROJECT (registry always visible; toggling needs a selection) ---- */
function renderProjectCol(items) {
  colProject.innerHTML = '';
  const multi = items.length > 1;
  let consistent = true, activeSet = new Set();
  if (items.length) {
    const sigs = items.map(it => setSign(it.block ? it.block.projectIds : []));
    consistent = !multi || sigs.every(s => s === sigs[0]);
    if (consistent) activeSet = new Set(items[0].block ? items[0].block.projectIds : []);
  }
  if (items.length && multi && !consistent && !unlocked.project) {
    const banner = document.createElement('div'); banner.className = 'mixed-banner';
    banner.innerHTML = `<span>${t('mixed')}</span><span class="actions">
      <button id="pjEdit">${t('edit')}</button><button id="pjMerge">${t('merge')}</button></span>`;
    colProject.appendChild(banner);
    banner.querySelector('#pjEdit').onclick = () => confirmThen(t('confirmOverwrite'), () => { unlocked.project = true; renderSidePanel(); });
    banner.querySelector('#pjMerge').onclick = () => confirmThen(t('confirmOverwrite'), () => mergeProjects(items));
    return;
  }

  const entries = Object.entries(db.projects);
  const pinned = entries.filter(([, p]) => p.pinned && !p.archived);
  const normal = entries.filter(([, p]) => !p.pinned && !p.archived);
  const archived = entries.filter(([, p]) => p.archived);

  function buildProjectRow(id, p, archivedRow) {
    const onToggle = (items.length && !archivedRow) ? () => {
      const turnOn = !activeSet.has(id);
      items.forEach(it => {
        const b = ensureBlock(it.key);
        const has = b.projectIds.includes(id);
        if (turnOn && !has) b.projectIds.push(id);
        if (!turnOn && has) b.projectIds = b.projectIds.filter(x => x !== id);
        pruneIfEmpty(it.key);
      });
      saveData(); renderAll();
    } : null;
    const extraButtons = archivedRow
      ? [lucideBtn('archive-restore', t('restore'), t('restore'), () => { p.archived = false; saveData(); renderAll(); })]
      : [
          lucideBtn('pin', p.pinned ? '\u2605' : '\u2606', t('pin'), () => { p.pinned = !p.pinned; saveData(); renderAll(); }),
          lucideBtn('archive', t('archive'), t('archive'), () => { p.archived = true; p.pinned = false; saveData(); renderAll(); })
        ];
    if (!archivedRow && p.pinned) extraButtons[0].classList.add('pinned');
    const row = buildTagRow(id, p,
      (c) => { p.color = c; saveData(); renderTimeline(); },
      (v) => { p.name = v.trim() || p.name; saveData(); renderTimeline(); },
      () => {
        delete db.projects[id];
        Object.values(db.blocks).forEach(b => { b.projectIds = b.projectIds.filter(x => x !== id); });
        Object.keys(db.blocks).forEach(pruneIfEmpty);
        saveData(); renderAll();
      },
      items.length && activeSet.has(id), onToggle,
      { archived: archivedRow, extraButtons, confirmDeleteMsg: t('confirmDeleteProject') });
    colProject.appendChild(row);
  }

  pinned.forEach(([id, p]) => buildProjectRow(id, p, false));
  normal.forEach(([id, p]) => buildProjectRow(id, p, false));

  const add = document.createElement('button'); add.className = 'addbtn'; add.textContent = t('addProject');
  add.onclick = () => { const id = uid('p'); db.projects[id] = { name: t('newProjectName'), color: randomColor(), pinned: false, archived: false }; saveData(); renderSidePanel(); };
  colProject.appendChild(add);

  archived.forEach(([id, p]) => buildProjectRow(id, p, true));
  refreshIcons();
}
function mergeProjects(items) {
  const union = new Set();
  items.forEach(it => (it.block ? it.block.projectIds : []).forEach(id => union.add(id)));
  items.forEach(it => { ensureBlock(it.key).projectIds = [...union]; });
  unlocked.project = false; saveData(); renderAll();
}

/* ---- AREA ---- */
function renderAreaCol(items) {

  const multi = items.length > 1;
  let consistent = true, current = null;
  if (items.length) {
    const vals = items.map(it => it.block ? it.block.areaId : null);

}
document.getElementById('prevDay').addEventListener('click', () => shiftDate(-1));
document.getElementById('nextDay').addEventListener('click', () => shiftDate(1));
document.getElementById('todayBtn').addEventListener('click', () => { currentDate = todayStr(); clearSelection(); });

// wheel over the timeline switches day (down = next day); accumulate + cooldown so trackpads don't skip days
let wheelAcc = 0, wheelLockUntil = 0;
timelinePanel.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (dragging) return;
  const now = Date.now();
  if (now < wheelLockUntil) return;
  wheelAcc += e.deltaY * (e.deltaMode === 1 ? 33 : 1);
  if (Math.abs(wheelAcc) < 50) return;
  const dir = wheelAcc > 0 ? 1 : -1;
  wheelAcc = 0;
  wheelLockUntil = now + 250;
  shiftDate(dir);
}, { passive: false });

/* ===================== mobile tabs ===================== */
const mobileTabs = document.getElementById('mobileTabs');
mobileTabs.addEventListener('click', (e) => {
  const btn = e.target.closest('button'); if (!btn) return;
  mobileActiveCol = btn.dataset.col; syncMobileTabs();
});
function syncMobileTabs() {
  [...mobileTabs.children].forEach(b => b.classList.toggle('active', b.dataset.col === mobileActiveCol));
  document.querySelectorAll('.side-col').forEach(c => c.classList.toggle('mobile-active', c.dataset.col === mobileActiveCol));
}

/* ===================== bootstrap ===================== */
/* ===================== import / export ===================== */
const exportBtn = document.getElementById('exportBtn');
const importBtn = document.getElementById('importBtn');
const importFile = document.getElementById('importFile');
function setIcon(btn, iconName, fallbackChar) {
  if (window.lucide) {
    btn.innerHTML = '';
    const i = document.createElement('i'); i.setAttribute('data-lucide', iconName); btn.appendChild(i);
  } else {
    btn.textContent = fallbackChar;
  }
}
function setupIO() {
  exportBtn.title = t('exportTitle');
  importBtn.title = t('importTitle');
  setIcon(exportBtn, 'cloud-download', '\u2913');
  setIcon(importBtn, 'cloud-upload', '\u2911');
}
function setupCP() {
  copyBtn.title = t('copyTitle');
  pasteBtn.title = t('pasteTitle');
  setIcon(copyBtn, 'copy', '\u2398');
  setIcon(pasteBtn, 'clipboard-paste', '\u2399');
}
exportBtn.onclick = () => {
  const data = JSON.stringify(db, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `topa-${currentDate}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
};
importBtn.onclick = () => importFile.click();
importFile.addEventListener('change', () => {
  const file = importFile.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); } catch (e) { alert(t('importInvalid')); importFile.value = ''; return; }
    if (!parsed || typeof parsed !== 'object' || !parsed.projects || !parsed.areas || !parsed.blocks) {
      alert(t('importInvalid')); importFile.value = ''; return;
    }
    confirmThen(t('confirmImport'), () => {
      const d = defaultData();
      db = Object.assign(d, parsed, {
        meta: Object.assign(d.meta, parsed.meta),
        theme: Object.assign(d.theme, parsed.theme),
        projects: parsed.projects || {},
        areas: parsed.areas || {},
        blocks: parsed.blocks || {},
        colorHistory: parsed.colorHistory || []
      });
      saveData();
      currentDate = todayStr();
      selected = new Set();
      applyTheme(); setupThemeSwatches(); renderAll();
    });
    importFile.value = '';
  };
  reader.readAsText(file);
});

function seedIfEmpty() {
  if (Object.keys(db.projects).length === 0) { const id = uid('p'); db.projects[id] = { name: '示例项目', color: randomColor(), pinned: false, archived: false }; }
  if (Object.keys(db.areas).length === 0) { const id = uid('a'); db.areas[id] = { name: '示例领域', color: randomColor() }; }
}
function renderAll() { syncViewTabs(); renderTimeline(); renderSidePanel(); syncMobileTabs(); }

seedIfEmpty();
applyTheme();
setupThemeSwatches();
setupIO();
setupCP();
renderAll();
refreshIcons();
saveData();
</script>
</body>
